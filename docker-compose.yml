services:
  postgres:
    image: postgres:16
    container_name: gestao_fiscal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestao_fiscal
      POSTGRES_PASSWORD: gestao_fiscal_dev
      POSTGRES_DB: gestao_fiscal
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: gestao_fiscal_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/tmp/pgpass:ro
    entrypoint:
      - /bin/sh
      - -c
      - cp /tmp/pgpass /var/lib/pgadmin/pgpass && chmod 600 /var/lib/pgadmin/pgpass && exec /entrypoint.sh
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
